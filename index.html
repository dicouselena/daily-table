<style>
/* Layout: smalle kolom, serif koppen, hairlines in plaats van kaarten, bonnetje voor de boodschappenlijst */
:root{
  --bg:#F3EBE0; --surface:#FAF5EE; --sand:#E5D9CA; --greige:#B3A298;
  --ink:#2B1519; --muted:#6F5F58; --line:#D8CBBB;
  --accent:#6B1E27; --accent-ink:#FBF4EC; --accent-soft:#EBDAD5;
  --warn:#7E5210; --warn-bg:#F1E2C6; --ok:#3B664B; --ok-bg:#DFE8D8;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Jost','Helvetica Neue',Arial,sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1F1114; --surface:#2A171B; --sand:#3A2328; --greige:#7E6B63;
    --ink:#F1E8DD; --muted:#BBA99E; --line:#4A3137;
    --accent:#E6959E; --accent-ink:#2B1519; --accent-soft:#4A262C;
    --warn:#E8BE72; --warn-bg:#3B2C14; --ok:#A5D0AF; --ok-bg:#21352A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1F1114; --surface:#2A171B; --sand:#3A2328; --greige:#7E6B63;
  --ink:#F1E8DD; --muted:#BBA99E; --line:#4A3137;
  --accent:#E6959E; --accent-ink:#2B1519; --accent-soft:#4A262C;
  --warn:#E8BE72; --warn-bg:#3B2C14; --ok:#A5D0AF; --ok-bg:#21352A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:14px 96px}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;text-wrap:balance}
h2{font-size:26px;line-height:1.1}
h3{font-size:20px}
.small{font-size:13px;color:var(--muted)}
.cap{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:30px;font-weight:500;letter-spacing:.02em;line-height:1}
.brand i{color:var(--accent);font-style:normal}
.prof{display:flex;align-items:center;gap:8px;min-width:0}
.prof select{min-width:0;max-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px}
.stores{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.store{background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 4px;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.store[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.meter{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.meter-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.meter-big{font-family:var(--serif);font-size:30px;line-height:1}
.bar{height:4px;background:var(--sand);border-radius:2px;margin-top:8px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent)}
.bar.over>span{background:var(--warn)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;background:var(--sand);color:var(--ink)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}

/* controls */
.sec{margin-top:22px}
.sec>.cap{display:block;margin-bottom:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn{background:transparent;border:1px solid var(--ink);border-radius:999px;padding:9px 18px;font-size:14px;letter-spacing:.02em}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:var(--line)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.field{display:flex;flex-direction:column;gap:4px}
.field label,.lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input[type=number],input[type=text],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:92px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* menu */
.day{margin-top:26px}
.day>h3{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--ink);padding-bottom:6px}
.day>h3 span{font-family:var(--sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.slot{padding:14px 0;border-bottom:1px solid var(--line)}
.slot-head{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:start}
@media (max-width:420px){.slot-head{grid-template-columns:1fr auto}.slot-head .cap{grid-column:1/-1}}
.slot-name{font-family:var(--serif);font-size:21px;line-height:1.15;min-width:0}
.slot-meta{margin-top:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.slot-tools{display:flex;gap:2px;align-items:center}
.ic{background:none;border:0;padding:6px;border-radius:6px;color:var(--muted);line-height:0}
.ic:hover{color:var(--ink)}
.ic.on{color:var(--accent)}
.ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic.on svg{fill:currentColor}
.slot.skipped .slot-name{color:var(--muted);font-style:italic}
.slot.done .slot-name{text-decoration:line-through;text-decoration-color:var(--greige)}
.slot-more{margin-top:12px;padding-left:88px;display:grid;gap:10px}
@media (max-width:420px){.slot-more{padding-left:0}}
.slot-more ul,.slot-more ol{margin:0;padding-left:18px}
.slot-more li{margin:2px 0}
.donebox{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.donebox input{accent-color:var(--accent)}
.hint{background:var(--accent-soft);color:var(--accent);padding:8px 12px;border-radius:8px;font-size:13px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted)}
.note.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}

/* lijst: bonnetje */
.receipt{margin-top:18px;background:var(--surface);border:1px solid var(--line);padding:18px 16px 26px;font-family:var(--mono);font-size:13px;position:relative}
.receipt::after{content:'';position:absolute;left:-1px;right:-1px;bottom:-9px;height:9px;background:radial-gradient(circle at 6px -1px,var(--bg) 6px,transparent 6.5px) 0 0/12px 9px repeat-x}
.receipt h4{margin:18px 0 6px;font:500 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);border-bottom:1px dashed var(--greige);padding-bottom:4px}
.receipt h4:first-child{margin-top:0}
.rl{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;padding:5px 0}
.rl input{accent-color:var(--accent);margin-top:3px}
.rl.have{opacity:.45;text-decoration:line-through}
.rl .nm{min-width:0;overflow-wrap:anywhere}
.rl .sub{display:block;color:var(--muted);font-size:12px}
.rl .pr{text-align:right;white-space:nowrap}
.rl .was{text-decoration:line-through;color:var(--muted);margin-right:6px}
.tag{display:inline-block;font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:3px;background:var(--warn-bg);color:var(--warn);margin-left:6px;vertical-align:1px}
.tag.est{background:var(--sand);color:var(--muted)}
.tot{display:flex;justify-content:space-between;border-top:1px solid var(--ink);margin-top:14px;padding-top:10px;font-size:15px}
.cmp{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.cmp button{display:flex;justify-content:space-between;gap:8px;background:transparent;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px;text-align:left}
.cmp button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.cmp b{font-weight:500}

/* favorieten / recepten */
.list>*{padding:12px 0;border-bottom:1px solid var(--line)}
.rowflex{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.rowflex>div{min-width:0}
.ing-row{display:grid;grid-template-columns:1fr 92px 32px;gap:8px;margin-bottom:8px}
.sub-form{margin-top:10px;padding:12px;border:1px dashed var(--greige);border-radius:8px;display:grid;gap:10px}
.empty{padding:28px 0;color:var(--muted);text-align:center;font-family:var(--serif);font-size:20px;font-style:italic}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:4px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:640px;gap:2px}
.tab{background:none;border:0;padding:10px 2px 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-top:2px solid transparent;margin-top:-6px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tab[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:no-preference){.bar>span{transition:width .4s}}
.namebtn{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit}
.namebtn:hover{color:var(--accent)}

/* grafieken: drie gevalideerde categoriekleuren, één neutrale kleur voor context */
:root{--c1:#A63D52;--c2:#3F6FA6;--c3:#AA8010;--cn:#B9AA9E;--on1:#FFFFFF;--on2:#FFFFFF;--on3:#2B1519}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c1:#C4545F;--c2:#4F8FD0;--c3:#B58A2A;--cn:#7E6B63;--on1:#1F1114;--on2:#1F1114;--on3:#1F1114}}
:root[data-theme="dark"]{--c1:#C4545F;--c2:#4F8FD0;--c3:#B58A2A;--cn:#7E6B63;--on1:#1F1114;--on2:#1F1114;--on3:#1F1114}
.ch{margin-top:30px}
.ch>h3{font-size:22px}
.ch>.small{margin:2px 0 0}
.wk{display:grid;gap:2px;margin-top:12px}
.wk .h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:4px;min-width:0;overflow:hidden}
.wk .rl2{font-size:12px;color:var(--muted);align-self:center;padding-right:6px}
.wcell{height:40px;min-width:0;border:0;border-radius:4px;font:500 13px var(--sans);padding:0}
.wcell.vlees{background:var(--c1);color:var(--on1)}
.wcell.vis{background:var(--c2);color:var(--on2)}
.wcell.vega{background:var(--c3);color:var(--on3)}
.wcell.none{background:transparent;border:1px solid var(--line);color:var(--muted)}
.wcell:hover,.wcell:focus-visible{filter:brightness(1.12)}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px;align-items:center}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.leg i.line{height:2px;width:14px;border-radius:1px;vertical-align:3px}
.hb{display:grid;grid-template-columns:minmax(80px,128px) minmax(0,1fr);gap:8px 12px;align-items:center;font-size:13px;margin-top:12px}
.hb .nm{min-width:0;overflow-wrap:anywhere}
.hb .tr{display:flex;align-items:center;gap:8px;min-width:0;height:26px}
.hb .tr button{background:none;border:0;padding:0;display:flex;align-items:center;gap:8px;width:100%;height:100%;text-align:left}
.hb .b{height:14px;border-radius:0 4px 4px 0;background:var(--c1);min-width:2px;flex:none}
.hb .b.dim{background:var(--cn)}
.hb .val{white-space:nowrap;font-variant-numeric:tabular-nums}
.col{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:0 8px;align-items:end;position:relative;height:150px;margin-top:14px;border-bottom:1px solid var(--line)}
.cb{background:none;border:0;padding:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.cb .bar{width:min(24px,70%);border-radius:4px 4px 0 0;background:var(--c1)}
.cb .bar.dim{background:var(--cn)}
.cb:hover .bar,.cb:focus-visible .bar{filter:brightness(1.15)}
.cb .cap{font-size:12px;margin-bottom:3px;font-variant-numeric:tabular-nums}
.colx{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:0 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;margin-top:5px}
.tgt{position:absolute;left:0;right:0;border-top:1px solid var(--muted);pointer-events:none}
.tgt span{position:absolute;right:0;bottom:2px;font-size:11px;color:var(--muted);background:var(--bg);padding-left:4px}
.kpis{display:flex;gap:12px 20px;flex-wrap:wrap;margin-top:16px}
.kpi{flex:1 1 120px;border-top:1px solid var(--ink);padding-top:8px;min-width:0}
.kpi b{display:block;font:500 30px/1.1 var(--serif)}
.line-svg{width:100%;height:auto;display:block;margin-top:10px}
.line-svg text{font:11px var(--sans);fill:var(--muted)}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 11px;border-radius:8px;font-size:13px;line-height:1.35;max-width:240px}
.tip b{display:block;font-weight:500;font-size:14px}
.tip span{display:block;opacity:.85}
.tbl{margin-top:26px}
.tbl summary{cursor:pointer;color:var(--accent);font-size:14px}
.tbl .scroll{overflow-x:auto;margin-top:10px}
.tbl table{width:100%;border-collapse:collapse;font-size:13px;min-width:460px}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.brand{display:flex;align-items:center;gap:8px}
.brand .logo{width:26px;height:29px;color:var(--ink);flex:none}
.cb .cap{text-transform:none;letter-spacing:0;color:var(--ink)}
.brand .logo{width:34px;height:37px}

.brand .logo{display:inline-block;height:38px;width:calc(38px * var(--lr));background:var(--accent);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;flex:none}

.thumb{flex:none;width:52px;height:52px;border-radius:10px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--accent);overflow:hidden;background:var(--bg)}
.thumb svg{width:34px;height:34px}.thumb img{width:100%;height:100%;object-fit:cover}
.nm2{display:flex;gap:12px;align-items:flex-start}.nm2>div{min-width:0}

const MEALS = ['ontbijt', 'lunch', 'diner'];
const MEAL_NL = { ontbijt: 'Ontbijt', lunch: 'Lunch', diner: 'Diner' };
const THR = { v: 8, e: 25 };
const HALAL_FACTOR = 1.1;
const MAX_PROFILES = 5;
const UNIT_NL = { g: 'g', ml: 'ml', st: 'st', sn: 'sneden', teen: 'tenen' };

const round2 = (x) => Math.round(x * 100) / 100;

function buildData(base, custom) {
  const D = { stores: base.stores, appliances: base.appliances, allergens: base.allergens, depts: base.depts };
  D.ingredients = base.ingredients.concat((custom && custom.ingredients) || []);
  D.ing = {};
  D.ingredients.forEach((i) => { D.ing[i.id] = i; });
  const own = ((custom && custom.recipes) || []).map((r) => Object.assign({ own: true }, r));
  D.recipes = base.recipes.map((r) => Object.assign({}, r)).concat(own).filter((r) => r.ing.every((x) => D.ing[x[0]]));
  D.rec = {};
  D.recipes.forEach((r) => { prepRecipe(D, r); D.rec[r.id] = r; });
  return D;
}

function prepRecipe(D, r) {
  r.items = r.ing.map((x) => ({ id: x[0], a: x[1] }));
  const ings = r.items.map((x) => D.ing[x.id]);
  const has = (f) => ings.some((i) => i.fl.indexOf(f) >= 0);
  r.allergens = [];
  ings.forEach((i) => i.al.forEach((a) => { if (r.allergens.indexOf(a) < 0) r.allergens.push(a); }));
  r.meat = has('meat'); r.fish = has('fish'); r.animal = has('animal'); r.pork = has('pork'); r.stremsel = has('stremsel');
  r.veg = !r.meat && !r.fish;
  r.vegan = !r.animal;
}

function eligible(D, P, meal) {
  let list = D.recipes.filter((r) => r.meals.indexOf(meal) >= 0);
  const steps = [];
  const f = (name, fn) => { const b = list.length; list = list.filter(fn); steps.push({ name, removed: b - list.length }); };
  f('smaak', (r) => TASTE.never.indexOf(r.id) < 0 && !r.items.some((x) => TASTE.nopeIng.indexOf(x.id) >= 0));
  f('apparatuur', (r) => r.needs.every((g) => g.split('|').some((a) => P.appliances.indexOf(a) >= 0)));
  f('allergieën', (r) => !r.allergens.some((a) => P.allergies.indexOf(a) >= 0));
  if (P.vegan) f('veganistisch', (r) => r.vegan); else if (P.veg) f('vegetarisch', (r) => r.veg);
  if (P.halal) f('halal', (r) => !r.pork);
  if (P.maxTijd) f('kooktijd', (r) => r.t <= P.maxTijd);
  if (P.nutri === 'vezel') f('vezelrijk', (r) => r.v != null && r.v >= THR.v);
  if (P.nutri === 'eiwit') f('eiwitrijk', (r) => r.e != null && r.e >= THR.e);
  if (P.nutri === 'beide') f('vezel- en eiwitrijk', (r) => r.v != null && r.e != null && r.v >= THR.v && r.e >= THR.e);
  return { list, steps };
}

function priceOf(D, prices, store, id) {
  const ing = D.ing[id];
  if (ing.cp != null) return { price: ing.cp, bonus: null, size: ing.pack, src: 'eigen' };
  const S = prices && prices.stores;
  const live = S && S[store] && S[store][id];
  if (live && typeof live.price === 'number') {
    const b = (typeof live.bonus === 'number' && live.bonus < live.price) ? live.bonus : null;
    return { price: live.price, bonus: b, size: live.size || ing.pack, src: 'live', label: live.label || null, mech: live.mech || null };
  }
  const st = D.stores.find((s) => s.id === store);
  const f = st ? st.factor : 1;
  const ah = S && S.ah && S.ah[id];
  const base = (ah && typeof ah.price === 'number') ? { price: ah.price, size: ah.size || ing.pack } : { price: ing.price, size: ing.pack };
  return { price: round2(base.price * f), bonus: null, size: base.size, src: 'schatting' };
}

function buildList(D, prices, store, rids, persons, halal) {
  const need = {};
  rids.forEach((rid) => {
    const r = D.rec[rid];
    if (!r) return;
    r.items.forEach((x) => { need[x.id] = (need[x.id] || 0) + x.a * persons; });
  });
  const lines = []; const pantry = [];
  Object.keys(need).forEach((id) => {
    const ing = D.ing[id];
    if (ing.pantry) { pantry.push(ing); return; }
    const p = priceOf(D, prices, store, id);
    const packs = Math.max(1, Math.ceil(need[id] / p.size - 1e-9));
    let unit = p.bonus != null ? p.bonus : p.price;
    let was = p.price; let src = p.src;
    const hm = !!(halal && ing.fl.indexOf('meat') >= 0);
    if (hm) { unit *= HALAL_FACTOR; was *= HALAL_FACTOR; src = 'schatting'; }
    lines.push({ id, ing, need: need[id], packs, size: p.size, unit: round2(unit), was: round2(was), bonus: p.bonus != null, cost: round2(packs * unit), saved: round2(packs * (was - unit)), src, label: p.label, mech: p.mech, halalMeat: hm });
  });
  pantry.sort((a, b) => a.naam.localeCompare(b.naam));
  return { lines, pantry };
}

function sumLines(lines, have) {
  let t = 0; let h = 0; let s = 0;
  lines.forEach((l) => {
    if (have && have[l.id]) return;
    if (l.halalMeat) h += l.cost; else t += l.cost;
    s += l.saved;
  });
  return { total: round2(t), halal: round2(h), saved: round2(s), all: round2(t + h) };
}

function recipeCost(D, prices, store, rid, persons, halal) {
  const r = D.rec[rid];
  if (!r) return 0;
  let c = 0;
  r.items.forEach((x) => {
    const ing = D.ing[x.id];
    if (ing.pantry) return;
    const p = priceOf(D, prices, store, x.id);
    let u = p.bonus != null ? p.bonus : p.price;
    if (halal && ing.fl.indexOf('meat') >= 0) u *= HALAL_FACTOR;
    c += (x.a * persons / p.size) * u;
  });
  return round2(c);
}

function scopeBudget(P, slotCount) {
  // P.budget geldt voor het standaardmenu van het profiel (P.days dagen x P.meals maaltijden)
  const per = Math.max(1, (P.days || 5) * Math.max(1, P.meals.length));
  return round2(P.budget * slotCount / per);
}

let TASTE = { liked: [], disliked: [], never: [], nopeIng: [] };
let CATW = {};
function setTaste(t, D) {
  TASTE = { liked: (t && t.liked) || [], disliked: (t && t.disliked) || [], never: (t && t.never) || [], nopeIng: (t && t.nopeIng) || [] };
  CATW = {};
  TASTE.liked.forEach((id) => { const r = D && D.rec[id]; if (r) CATW[r.cat] = (CATW[r.cat] || 0) + 1; });
  TASTE.disliked.forEach((id) => { const r = D && D.rec[id]; if (r) CATW[r.cat] = (CATW[r.cat] || 0) - 1; });
}
function tasteWeight(r) {
  let w = Math.pow(0.85, Math.max(-3, Math.min(3, CATW[r.cat] || 0)));
  if (TASTE.liked.indexOf(r.id) >= 0) w *= 0.45;
  if (TASTE.disliked.indexOf(r.id) >= 0) w *= 3;
  return w;
}

function shuffleWeighted(list, rng, favs, boost) {
  return list.map((r) => ({ r, k: rng() * ((boost && favs.indexOf(r.id) >= 0) ? 0.4 : 1) * tasteWeight(r) }))
    .sort((a, b) => a.k - b.k).map((x) => x.r);
}

function planCost(D, prices, store, slots, P, have) {
  const rids = slots.filter((s) => s.rid).map((s) => s.rid);
  const bl = buildList(D, prices, store, rids, P.personen, P.halal);
  return sumLines(bl.lines, have);
}

function scorePlan(D, prices, store, slots, P, budget, rng) {
  const sm = planCost(D, prices, store, slots, P);
  let score = sm.all <= budget ? 1000 - sm.all * 0.15 : 1000 - (sm.all - budget) * 40;
  MEALS.forEach((m) => {
    const c = {}; let n = 0;
    slots.filter((s) => s.meal === m && s.rid && D.rec[s.rid]).forEach((s) => { const k = D.rec[s.rid].cat; c[k] = (c[k] || 0) + 1; n++; });
    const lim = Math.max(2, Math.ceil(n / 3));
    Object.keys(c).forEach((k) => { if (c[k] > lim) score -= 25 * (c[k] - lim); });
    score += Object.keys(c).length * 12;
  });
  score += sm.saved * 6 + rng() * 8;
  return { score, total: sm.all };
}

function generatePlan(D, prices, P, cfg, store, favs, rng) {
  rng = rng || Math.random;
  const elig = {}; const diag = {};
  cfg.meals.forEach((m) => { const e = eligible(D, P, m); elig[m] = e.list; diag[m] = e.steps; });
  const days = cfg.days;
  const slotCount = days * cfg.meals.length;
  const budget = scopeBudget(P, slotCount);
  let best = null;
  for (let t = 0; t < 300; t++) {
    const per = {};
    cfg.meals.forEach((m) => {
      const pool = shuffleWeighted(elig[m], rng, favs, P.favBoost);
      per[m] = [];
      for (let d = 0; d < days; d++) per[m].push(pool.length ? pool[d % pool.length].id : null);
    });
    const slots = [];
    for (let d = 0; d < days; d++) cfg.meals.forEach((m) => slots.push({ d, meal: m, rid: per[m][d], done: false }));
    const sc = scorePlan(D, prices, store, slots, P, budget, rng);
    if (!best || sc.score > best.score) best = { slots, score: sc.score };
  }
  return { slots: best.slots, diag, budget };
}

function pickForSlot(D, prices, P, plan, idx, store, rng) {
  rng = rng || Math.random;
  const slot = plan.slots[idx];
  const e = eligible(D, P, slot.meal).list;
  const usedSame = plan.slots.filter((s, i) => s.meal === slot.meal && i !== idx && s.rid).map((s) => s.rid);
  let cands = e.filter((r) => usedSame.indexOf(r.id) < 0 && r.id !== slot.rid);
  if (!cands.length) cands = e.filter((r) => r.id !== slot.rid);
  if (!cands.length) cands = e;
  if (!cands.length) return null;
  const budget = planBudget(P, plan);
  const scored = cands.map((r) => {
    const slots = plan.slots.map((s, i) => (i === idx ? Object.assign({}, s, { rid: r.id }) : s));
    return { r, total: planCost(D, prices, store, slots, P).all };
  });
  const ok = scored.filter((x) => x.total <= budget);
  if (ok.length) return ok[Math.floor(rng() * ok.length)].r.id;
  scored.sort((a, b) => a.total - b.total);
  return scored[0].r.id;
}

function planBudget(P, plan) {
  if (plan.budgetOverride != null) return plan.budgetOverride;
  return scopeBudget(P, plan.cfg.days * plan.cfg.meals.length);
}

/* ---------- formatting ---------- */
function fmtNum(n) { return String(n).replace('.', ','); }
function amountText(unit, n) {
  if (unit === 'g') { if (n >= 1000) return fmtNum(Math.round(n / 100) / 10) + ' kg'; return Math.max(5, Math.round(n / 5) * 5) + ' g'; }
  if (unit === 'ml') { if (n >= 1000) return fmtNum(Math.round(n / 100) / 10) + ' l'; return Math.max(5, Math.round(n / 5) * 5) + ' ml'; }
  const q = Math.max(0.5, Math.round(n * 2) / 2);
  return fmtNum(q) + ' ' + (UNIT_NL[unit] || unit);
}
const EUR = typeof Intl !== 'undefined' ? new Intl.NumberFormat('nl-NL', { style: 'currency', currency: 'EUR' }) : null;
function eur(x) { return EUR ? EUR.format(x) : '€' + x.toFixed(2); }

function shareText(D, store, lines, pantry, have, total, storeName) {
  const out = ['Boodschappen · Daily Table · ' + storeName];
  D.depts.forEach((d) => {
    const ls = lines.filter((l) => l.ing.dept === d[0] && !have[l.id] && !l.halalMeat);
    if (!ls.length) return;
    out.push('', d[1]);
    ls.forEach((l) => out.push('- ' + l.ing.naam + ' · ' + l.packs + '× ' + amountText(l.ing.unit, l.size)));
  });
  const hm = lines.filter((l) => l.halalMeat && !have[l.id]);
  if (hm.length) {
    out.push('', 'Vlees (halal)');
    hm.forEach((l) => out.push('- ' + l.ing.naam + ' · ' + amountText(l.ing.unit, l.need)));
  }
  if (pantry.length) out.push('', 'Voorraadkast, check even: ' + pantry.map((p) => p.naam.toLowerCase()).join(', '));
  out.push('', 'Totaal ca. ' + eur(total));
  return out.join('\n');
}

const CAT_NL = { vlees: 'Vlees', vis: 'Vis', vega: 'Vega' };
function catGroup(r) { return r.meat ? 'vlees' : (r.fish ? 'vis' : 'vega'); }

function dayInsights(D, plan) {
  const days = [];
  for (let d = 0; d < plan.cfg.days; d++) days.push({ d, e: 0, v: 0, kcal: 0, t: 0, w: 0, n: 0, missing: 0, meals: [] });
  plan.slots.forEach((s, idx) => {
    const day = days[s.d];
    if (!day) return;
    const r = s.rid ? D.rec[s.rid] : null;
    day.meals.push({ meal: s.meal, r, idx });
    if (!r) return;
    day.n++; day.t += r.t; day.w += r.w || 0;
    if (r.e != null) day.e += r.e; else day.missing++;
    if (r.v != null) day.v += r.v;
    if (r.kcal) day.kcal += r.kcal;
  });
  return days;
}

function deptTotals(D, lines, have) {
  const out = {};
  lines.forEach((l) => {
    if (have && have[l.id]) return;
    out[l.ing.dept] = (out[l.ing.dept] || 0) + l.cost;
  });
  return D.depts.map((d) => ({ id: d[0], naam: d[1], cost: round2(out[d[0]] || 0) })).filter((x) => x.cost > 0).sort((a, b) => b.cost - a.cost);

const LOGO_RATIO = 0.9046;
const LOGO = '<span class="logo" role="img" aria-label="Daily Table monogram"></span>';

/* ---------- inzicht: grafieken ---------- */
const DAYS_SHORT = ['zo', 'ma', 'di', 'wo', 'do', 'vr', 'za'];
function dayShort(i) {
  const d = new Date(ST.plan.start + 'T12:00:00'); d.setDate(d.getDate() + i);
  return DAYS_SHORT[d.getDay()];
}
const tipAttr = (title, lines) => ' data-tip="' + esc([title].concat(lines || []).join('|')) + '"';

function weekGridHTML() {
  const pl = ST.plan; const n = pl.cfg.days;
  let h = '<div class="wk" style="grid-template-columns:62px repeat(' + n + ',minmax(0,1fr))" role="group" aria-label="Weekoverzicht"><span></span>';
  for (let d = 0; d < n; d++) h += '<span class="h">' + dayShort(d) + '</span>';
  pl.cfg.meals.forEach((m) => {
    h += '<span class="rl2">' + MEAL_NL[m] + '</span>';
    for (let d = 0; d < n; d++) {
      const s = pl.slots.find((x) => x.d === d && x.meal === m); const r = s && s.rid ? D.rec[s.rid] : null;
      if (!r) { h += '<span class="wcell none" aria-label="leeg">·</span>'; continue; }
      const g = catGroup(r);
      h += '<button class="wcell ' + g + '"' + tipAttr(r.naam, [CAT_NL[g] + ' · ' + timeText(r), eur(recipeCost(D, PRICES, pl.store, r, pl.persons)) + ' voor ' + pl.persons + ' pers.']) + '>' + r.t + '′</button>';
    }
  });
  h += '</div><div class="leg"><span><i style="background:var(--c1)"></i>Vlees</span><span><i style="background:var(--c2)"></i>Vis</span><span><i style="background:var(--c3)"></i>Vega</span><span>getal is actieve kooktijd in minuten</span></div>';
  return h;
}

function hbarsHTML(rows, fmt, hi) {
  const max = Math.max.apply(null, rows.map((r) => r.v).concat([0.01]));
  return '<div class="hb">' + rows.map((r, i) => '<span class="nm">' + esc(r.label) + '</span><div class="tr"><button' + tipAttr(r.label, r.tip || [fmt(r.v)]) + '><span class="b' + (hi != null && i !== hi ? ' dim' : '') + '" style="width:calc((100% - 70px) * ' + (r.v / max).toFixed(3) + ')"></span><span class="val">' + fmt(r.v) + '</span></button></div>').join('') + '</div>';
}

function colsHTML(vals, labels, o) {
  const n = vals.length; const max = Math.max.apply(null, vals.concat([o.target || 0, 1])) * 1.12;
  const H = 150;
  let h = '<div class="col" style="--n:' + n + '">';
  vals.forEach((v, i) => {
    const hit = o.target ? v >= o.target : true;
    h += '<button class="cb"' + tipAttr(labels[i], o.tip(i)) + '><span class="cap">' + (v ? o.fmt(v) : '') + '</span><span class="bar' + (hit ? '' : ' dim') + '" style="height:' + Math.max(2, Math.round(v / max * (H - 22))) + 'px"></span></button>';
  });
  if (o.target) h += '<div class="tgt" style="bottom:' + Math.round(o.target / max * (H - 22)) + 'px"><span>doel ' + o.fmt(o.target) + '</span></div>';
  h += '</div><div class="colx" style="--n:' + n + '">' + labels.map((l) => '<span>' + l + '</span>').join('') + '</div>';
  return h;
}

function lineChartHTML(hist) {
  const W = 320; const H = 150; const L = 8; const R = 12; const T = 12; const B = 24;
  const n = hist.length;
  const max = Math.max.apply(null, hist.map((x) => Math.max(x.spent, x.budget))) * 1.15 || 1;
  const x = (i) => L + (n === 1 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1));
  const y = (v) => T + (H - T - B) * (1 - v / max);
  const pts = (k) => hist.map((p, i) => x(i).toFixed(1) + ',' + y(p[k]).toFixed(1)).join(' ');
  let s = '<svg class="line-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Uitgaven en budget per menu">';
  [0, 0.5, 1].forEach((f) => { const yy = (T + (H - T - B) * f).toFixed(1); s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--line)" stroke-width="1"/>'; });
  s += '<polyline points="' + pts('budget') + '" fill="none" stroke="var(--cn)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  s += '<polyline points="' + pts('spent') + '" fill="none" stroke="var(--c1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  hist.forEach((p, i) => {
    s += '<g class="hit"' + tipAttr(p.label, ['Uitgaven ' + eur(p.spent), 'Budget ' + eur(p.budget), storeName(p.store)]) + ' tabindex="0"><rect x="' + (x(i) - 14) + '" y="0" width="28" height="' + H + '" fill="transparent"/><circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.spent).toFixed(1) + '" r="4" fill="var(--c1)" stroke="var(--bg)" stroke-width="2"/></g>';
    if (n <= 8 || i === 0 || i === n - 1) s += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(p.short) + '</text>';
  });
  return s + '</svg><div class="leg"><span><i class="line" style="background:var(--c1)"></i>Uitgaven</span><span><i class="line" style="background:var(--cn)"></i>Budget</span></div>';
}

function recordHistory() {

function inzichtHTML() {
  const pl = ST.plan; const P = activeP(); const c = calc();
  if (!c.rids.length) return '<div class="empty">Nog geen menu om te laten zien.</div>';
  const days = dayInsights(D, pl);
  const share = pl.cfg.meals.reduce((a, m) => a + ({ ontbijt: 0.25, lunch: 0.3, diner: 0.45 }[m] || 0), 0);
  const eDoel = Math.round((P.eiwitDoel || 55) * share); const vDoel = Math.round((P.vezelDoel || 30) * share);
  const left = round2(c.budget - c.sm.all);
  const totalMin = days.reduce((a, d) => a + d.t, 0);
  const filled = days.filter((d) => d.n);

  const cheapest = Math.min.apply(null, stores.map((x) => x.v));

  const labels = days.map((d) => dayShort(d.d));
  const eChart = colsHTML(days.map((d) => Math.round(d.e)), labels, { target: eDoel, fmt: (v) => v + ' g', tip: (i) => [Math.round(days[i].e) + ' g eiwit', 'doel ' + eDoel + ' g'].concat(days[i].missing ? ['niet alles bekend'] : []) });

  const tChart = colsHTML(days.map((d) => d.t), labels, { fmt: (v) => v + '′', tip: (i) => [days[i].t + ' min actief koken', days[i].w ? days[i].w + ' min wachten (oven, marineren)' : 'geen wachttijd'] });

  const hist = ST.history || [];
  const hChart = hist.length >= 2 ? lineChartHTML(hist) : '<div class="empty" style="margin-top:12px">Het verloop verschijnt zodra je meer dan één menu hebt gemaakt. Elk menu telt als een punt.</div>';

  const mealsPerDay = pl.cfg.meals.length;
  const partial = '';

  return kpis
    + '<section class="ch"><h3>Waar gaat je geld heen</h3><p class="small">Per afdeling, ' + esc(storeName(pl.store)) + '.</p>' + depChart + '</section>'
    + '<section class="ch"><h3>Vergelijk winkels</h3><p class="small">Hetzelfde menu, de goedkoopste winkel staat gemarkeerd.</p>' + stChart + '<p class="small">' + esc(priceStatus(pl.store)) + '</p></section>'
    + '<section class="ch"><h3>Eiwit per dag</h3><p class="small">Gemiddeld ' + avgE + ' g per dag, schatting.</p>' + eChart + partial + '</section>'
    + '<section class="ch"><h3>Vezels per dag</h3><p class="small">Doel ' + vDoel + ' g, stel je in bij Profiel.</p>' + vChart + '</section>'
    + '<section class="ch"><h3>Kooktijd per dag</h3><p class="small">Actieve tijd in de keuken, in minuten.</p>' + tChart + '</section>'
    + '<section class="ch"><h3>Budgetverloop</h3><p class="small">Je laatste menu\'s tegenover je budget.</p>' + hChart + '</section>'
    + tableHTML(['Dag', 'Eiwit g', 'Vezels g', 'Kooktijd min', 'Gerechten'], days.map((d) => [dayShort(d.d), Math.round(d.e), Math.round(d.v), d.t, d.meals.filter((m) => m.r).map((m) => m.r.naam).join(', ')]))
    + tableHTML(['Afdeling', 'Kosten'], dep.map((x) => [x.naam, eur(x.cost)]).concat(stores.map((x) => [x.naam + ' (totaal)', eur(x.v)])))
    + (hist.length ? tableHTML(['Menu', 'Uitgaven', 'Budget'], hist.map((h) => [h.label, eur(h.spent), eur(h.budget)])) : '');
}

/* ---------- tooltip ---------- */
let TIPEL = null;
function showTip(el) {
  const raw = el.getAttribute('data-tip'); if (!raw) return;
  const parts = raw.split('|');
  if (!TIPEL) { TIPEL = document.createElement('div'); TIPEL.className = 'tip'; TIPEL.setAttribute('role', 'tooltip'); document.body.appendChild(TIPEL); }
  TIPEL.textContent = '';
  const b = document.createElement('b'); b.textContent = parts[1] || parts[0]; TIPEL.appendChild(b);
  const first = document.createElement('span'); first.textContent = parts[1] ? parts[0] : ''; if (parts[1]) TIPEL.appendChild(first);
  parts.slice(2).forEach((t) => { const s = document.createElement('span'); s.textContent = t; TIPEL.appendChild(s); });
  TIPEL.style.display = 'block';
  const r = el.getBoundingClientRect(); const tw = TIPEL.offsetWidth; const th = TIPEL.offsetHeight;
  let x = r.left + r.width / 2 - tw / 2; x = Math.max(8, Math.min(window.innerWidth - tw - 8, x));
  let y = r.top - th - 8; if (y < 8) y = r.bottom + 8;
  TIPEL.style.left = x + 'px'; TIPEL.style.top = y + 'px';
}
function hideTip() { if (TIPEL) TIPEL.style.display = 'none'; }
document.addEventListener('pointerover', (e) => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el); else hideTip(); });
document.addEventListener('focusin', (e) => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el); });
document.addEventListener('focusout', hideTip);
document.addEventListener('click', (e) => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el); else hideTip(); });
document.addEventListener('scroll', hideTip, true);

/* ---------- smaakprofiel ---------- */
function applyTaste() { setTaste(ST.taste, D); }

function buildQueue() {
  const P = activeP(); const q = [];
  ['ontbijt', 'lunch', 'diner'].forEach((m) => {
    const list = eligible(D, P, m).list.filter((r) => !r.own).slice();
    for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = list[i]; list[i] = list[j]; list[j] = t; }
    const seen = {}; const pick = [];
    list.forEach((r) => { if (pick.length < 4 && !seen[r.cat]) { seen[r.cat] = 1; pick.push(r); } });
    list.forEach((r) => { if (pick.length < 4 && pick.indexOf(r) < 0) pick.push(r); });
    pick.forEach((r) => { if (!q.some((x) => x.id === r.id)) q.push(r); });
  });
  return q.map((r) => r.id);
}

function tasteHTML() {

    + '<div class="actions"><button class="linkbtn" data-a="swnever">Dit eet ik echt niet, nooit meer tonen</button><button class="linkbtn" data-a="swnope">Sla de rest over</button></div>';
}

function startTaste() {
  UI.sw = { queue: buildQueue(), i: 0, step: 'swipe' };
  UI.tab = 'smaak';
}
function tasteNext() { UI.sw.i++; if (UI.sw.i >= UI.sw.queue.length) UI.sw.step = 'nope'; render(); }

function tasteAct(a, ds) {
  const T = ST.taste;
  switch (a) {
    case 'swlike': { const id = UI.sw.queue[UI.sw.i]; if (T.liked.indexOf(id) < 0) T.liked.push(id); T.disliked = T.disliked.filter((x) => x !== id); applyTaste(); save(); tasteNext(); return true; }
    case 'swno': { const id = UI.sw.queue[UI.sw.i]; if (T.disliked.indexOf(id) < 0) T.disliked.push(id); T.liked = T.liked.filter((x) => x !== id); applyTaste(); save(); tasteNext(); return true; }
    case 'swnever': { const id = UI.sw.queue[UI.sw.i]; if (T.never.indexOf(id) < 0) T.never.push(id); applyTaste(); save(); tasteNext(); return true; }
    case 'swnope': UI.sw.step = 'nope'; render(); return true;
    case 'nopetog': { const i = T.nopeIng.indexOf(ds.v); if (i >= 0) T.nopeIng.splice(i, 1); else T.nopeIng.push(ds.v); applyTaste(); save(); render(); return true; }
    case 'swfinish': T.done = true; UI.tab = 'menu'; applyTaste(); newPlan(); save(); render(); window.scrollTo(0, 0); return true;
    case 'tasteagain': startTaste(); render(); window.scrollTo(0, 0); return true;
    case 'tastenope': UI.sw = { queue: [], i: 0, step: 'nope' }; UI.tab = 'smaak'; render(); return true;
    case 'neverclear': T.never = []; T.disliked = []; applyTaste(); save(); render(); return true;
    case 'neverdel': T.never = T.never.filter((x) => x !== ds.v); applyTaste(); save(); render(); return true;
    case 'photodel': delete ST.photos[ds.v]; save(); render(); return true;
    default: return false;
  }
}

  const nope = T.nopeIng.length ? '<div class="small">Eet je niet: ' + T.nopeIng.map((id) => esc(D.ing[id] ? D.ing[id].naam.toLowerCase() : id)).join(', ') + '</div>' : '';
  return '<div class="sec"><span class="cap">Smaak</span><div class="small">' + T.liked.length + ' gerechten lekker, ' + T.disliked.length + ' niet voor jou.</div>' + never + nope

}

(function () {

      const s = Math.min(1, 480 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);

function save() { try { recordHistory(); } catch (e) { /* geen geschiedenis */ }
  try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) { /* geen opslag */ } }

function rebuild() { D = buildData(BASE, ST.custom); }
function activeP() {
  if (ST.activeId === 'temp' && TEMP) return TEMP;
  return ST.profiles.find((p) => p.id === ST.activeId) || ST.profiles[0];
}
function storeName(id) { const s = D.stores.find((x) => x.id === id); return s ? s.naam : id; }
const bySlot = (a, b) => (a.d - b.d) || (MEALS.indexOf(a.meal) - MEALS.indexOf(b.meal));

function newPlan() {
  const P = activeP();
  const cfg = { days: P.days, meals: P.meals.slice() };
  const g = generatePlan(D, PRICES, P, cfg, P.store, ST.favs, Math.random);
  ST.plan = { cfg, start: todayISO(), slots: g.slots, store: P.store, budgetOverride: null, have: {}, persons: P.personen, pid: P.id };
  save();
}

function reconcile() {
  const pl = ST.plan; const P = activeP();
  const keep = pl.slots.filter((s) => s.d < pl.cfg.days && pl.cfg.meals.indexOf(s.meal) >= 0);
  const add = [];
  for (let d = 0; d < pl.cfg.days; d++) {
    pl.cfg.meals.forEach((m) => { if (!keep.some((s) => s.d === d && s.meal === m)) add.push({ d, meal: m, rid: null, done: false }); });
  }
  pl.slots = keep.concat(add).sort(bySlot);
  add.forEach((a) => { const idx = pl.slots.indexOf(a); a.rid = pickForSlot(D, PRICES, P, pl, idx, pl.store); });
  pl.budgetOverride = null;
  save();
}

function calc() {
  const pl = ST.plan; const P = activeP();
  const rids = pl.slots.filter((s) => s.rid && D.rec[s.rid]).map((s) => s.rid);
  const bl = buildList(D, PRICES, pl.store, rids, pl.persons, P.halal);
  const sm = sumLines(bl.lines, pl.have);
  const budget = planBudget(P, pl);
  return { rids, bl, sm, budget };
}

function priceStatus(store) {
  const S = PRICES && PRICES.stores;
  const n = (S && S[store]) ? Object.keys(S[store]).length : 0;
  const nm = storeName(store);
  const tot = D.ingredients.filter((i) => !i.pantry && !i.cp).length;
  if (n) return nm + ': winkelprijzen van ' + (PRICES.updated || 'onbekend') + ' (bron ' + (PRICES.bron || 'onbekend') + '), ' + n + ' van ' + tot + ' ingrediënten. De rest is geschat. Acties en bonus zijn nog niet inbegrepen.';
  if (S && S.ah && Object.keys(S.ah).length) return nm + ': geschat op basis van de AH-prijzen van ' + (PRICES.updated || 'onbekend') + '.';
  return 'Prijzen zijn nu schattingen. Zodra het weekscript draait, staan hier de echte winkelprijzen.';
}

/* ---------- views ---------- */
function headerHTML() {
  const pl = ST.plan; const P = activeP();
  const opts = ST.profiles.map((p) => '<option value="' + p.id + '"' + (ST.activeId === p.id ? ' selected' : '') + '>' + esc(p.naam) + (p.id === ST.defaultId ? ' ★' : '') + '</option>').join('')
    + (TEMP ? '<option value="temp"' + (ST.activeId === 'temp' ? ' selected' : '') + '>Tijdelijk</option>' : '');
  const stores = D.stores.map((s) => '<button class="store" data-a="store" data-v="' + s.id + '" aria-pressed="' + (pl.store === s.id) + '">' + esc(s.naam) + '</button>').join('');
  const c = calc();
  const tot = c.sm.all; const over = tot > c.budget + 0.005;
  const pct = c.budget > 0 ? Math.min(100, Math.round(tot / c.budget * 100)) : 0;
  const diff = Math.abs(round2(c.budget - tot));
  const pills = [(over ? '<span class="pill warn">' + eur(diff) + ' boven budget</span>' : '<span class="pill ok">' + eur(diff) + ' onder budget</span>')];
  if (c.sm.saved > 0.004) pills.push('<span class="pill accent">' + eur(c.sm.saved) + ' bespaard met bonus</span>');
  if (P.halal && c.sm.halal > 0) pills.push('<span class="pill">waarvan ' + eur(c.sm.halal) + ' halal vlees (geschat)</span>');
  return '<header class="top"><div class="brand">' + LOGO + '<span>daily table<i>.</i></span></div>'
    + '<label class="prof"><span class="sr">Profiel</span><select data-a="profsel" aria-label="Profiel">' + opts + '</select></label></header>'
    + '<div class="stores" role="group" aria-label="Supermarkt">' + stores + '</div>'
    + '<div class="meter"><div class="meter-row"><span class="meter-big num">' + eur(tot) + '</span><span class="small num">van ' + eur(c.budget) + ' voor ' + pl.slots.filter((s) => s.rid).length + ' maaltijden, ' + pl.persons + ' pers.</span></div>'
    + '<div class="bar' + (over ? ' over' : '') + '"><span style="width:' + pct + '%"></span></div>'
    + '<div class="actions" style="margin-top:8px">' + pills.join('') + '</div></div>';
}

function tagsFor(r, P) {
  const t = [];
  if (r.own) t.push('<span class="pill accent">eigen</span>');
  if (r.vegan) t.push('<span class="pill">veganistisch</span>'); else if (r.veg) t.push('<span class="pill">vegetarisch</span>');
  if (r.v != null && r.v >= THR.v) t.push('<span class="pill">vezelrijk</span>');
  if (r.e != null && r.e >= THR.e) t.push('<span class="pill">eiwitrijk</span>');
  return t.join('');
}
function timeText(r) {
  let s = r.t + ' min';
  if (r.w) s += ' + ' + (r.w >= 60 ? Math.round(r.w / 60) + ' u' : r.w + ' min') + ' wachten';
  return s;
}
function dayLabel(i) {
  const d = new Date(ST.plan.start + 'T12:00:00'); d.setDate(d.getDate() + i);
  const today = todayISO();
  const iso = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const txt = d.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });
  return { main: iso === today ? 'Vandaag' : txt.charAt(0).toUpperCase() + txt.slice(1), sub: iso === today ? txt : '' };
}

function slotHTML(s, idx, P, pl) {
  const r = s.rid ? D.rec[s.rid] : null;
  const head = '<span class="cap">' + MEAL_NL[s.meal] + '</span>';
  if (!r) {
    return '<div class="slot skipped"><div class="slot-head">' + head + '<div class="slot-name">Overgeslagen</div>'
      + '<div class="slot-tools"><button class="btn sm" data-a="add" data-i="' + idx + '">Toevoegen</button></div></div></div>';
  }
  const fav = ST.favs.indexOf(r.id) >= 0;
  const cost = recipeCost(D, PRICES, pl.store, r.id, pl.persons, P.halal);
  const open = !!UI.open[idx];
  let more = '';
  if (open) {
    const ings = r.items.map((x) => { const ing = D.ing[x.id]; return '<li>' + esc(ing.naam) + (ing.pantry ? '' : ' · ' + amountText(ing.unit, x.a * pl.persons)) + '</li>'; }).join('');
    const steps = r.steps.map((t) => '<li>' + esc(t) + '</li>').join('');
    const al = r.allergens.length ? '<div class="small">Bevat: ' + r.allergens.map(esc).join(', ') + '. Controleer altijd de verpakking.</div>' : '<div class="small">Geen van de bekende allergenen. Controleer altijd de verpakking.</div>';
    const halalNote = P.halal ? '<div class="small">' + (r.meat ? 'Koop het vlees halal-gecertificeerd. ' : '') + (r.stremsel ? 'Check of de kaas vegetarisch gestremd is.' : '') + '</div>' : '';
    const prompt = (s.done && !fav) ? '<div class="hint">Lekker? <button class="linkbtn" data-a="fav" data-i="' + idx + '">Zet hem bij je favorieten</button></div>' : '';
    more = '<div class="slot-more"><div><div class="cap">Ingrediënten voor ' + pl.persons + '</div><ul>' + ings + '</ul></div>'
      + '<div><div class="cap">Bereiding</div><ol>' + steps + '</ol></div>' + al + halalNote
      + '<label class="donebox"><input type="checkbox" data-a="done" data-i="' + idx + '"' + (s.done ? ' checked' : '') + '> Gemaakt</label>' + prompt + photoHTML(r, s) + '</div>';
  }
  return '<div class="slot' + (s.done ? ' done' : '') + '"><div class="slot-head">' + head
    + '<div class="nm2">' + thumbHTML(r) + '<div><button class="namebtn slot-name" data-a="open" data-i="' + idx + '" aria-expanded="' + open + '">' + esc(r.naam) + '</button>'
    + '<div class="slot-meta"><span>' + timeText(r) + '</span><span class="num">≈ ' + eur(cost) + '</span>' + (r.kcal ? '<span class="num">' + r.kcal + ' kcal p.p.</span>' : '') + '</div>'
    + '<div class="slot-meta">' + tagsFor(r, P) + '</div></div></div>'
    + '<div class="slot-tools"><button class="ic' + (fav ? ' on' : '') + '" data-a="fav" data-i="' + idx + '" aria-label="' + (fav ? 'Verwijder uit favorieten' : 'Zet bij favorieten') + '" aria-pressed="' + fav + '">' + ICON.heart + '</button>'
    + '<button class="ic" data-a="swap" data-i="' + idx + '" aria-label="Ander gerecht">' + ICON.swap + '</button>'
    + '<button class="ic" data-a="remove" data-i="' + idx + '" aria-label="Maaltijd overslaan">' + ICON.x + '</button></div></div>' + more + '</div>';
}

function photoHTML(r, s) {
  if (!s.done) return '';
  const ph = ST.photos && ST.photos[r.id];
  return '<div class="photo-row">' + (ph ? '<img alt="Jouw foto van ' + esc(r.naam) + '" src="' + esc(ph) + '"><button class="linkbtn" data-a="photodel" data-v="' + r.id + '">Foto verwijderen</button>' : '')
    + '<label class="filebtn">' + (ph ? 'Andere foto' : 'Foto van jouw versie toevoegen') + '<input type="file" accept="image/*" data-a="photo" data-v="' + r.id + '"></label></div>';
}

function diagHTML() {
  const P = activeP(); const pl = ST.plan; const out = [];
  pl.cfg.meals.forEach((m) => {
    const e = eligible(D, P, m);
    if (e.list.length === 0) {
      const worst = e.steps.slice().sort((a, b) => b.removed - a.removed)[0];
      out.push('Voor ' + MEAL_NL[m].toLowerCase() + ' blijft geen enkel recept over' + (worst && worst.removed ? '. Het strengste filter is ' + worst.name + '.' : '.') + ' Pas je profiel aan.');
    } else if (e.list.length < pl.cfg.days) {
      out.push('Voor ' + MEAL_NL[m].toLowerCase() + ' zijn er maar ' + e.list.length + ' recepten, dus je ziet herhalingen.');
    }
  });
  return out.length ? '<div class="note warn" style="margin-top:14px">' + out.map(esc).join('<br>') + '</div>' : '';
}

function menuHTML() {
  const pl = ST.plan; const P = activeP();
  const dayBtns = [1, 2, 3, 4, 5, 6, 7].map((n) => '<button class="chip" data-a="days" data-v="' + n + '" aria-pressed="' + (pl.cfg.days === n) + '">' + n + '</button>').join('');
  const mealBtns = MEALS.map((m) => '<button class="chip" data-a="mealtog" data-v="' + m + '" aria-pressed="' + (pl.cfg.meals.indexOf(m) >= 0) + '">' + MEAL_NL[m] + '</button>').join('');
  const auto = scopeBudget(P, pl.cfg.days * pl.cfg.meals.length);
  let days = '';
  for (let d = 0; d < pl.cfg.days; d++) {
    const lab = dayLabel(d);
    const rows = pl.slots.map((s, i) => ({ s, i })).filter((x) => x.s.d === d).map((x) => slotHTML(x.s, x.i, P, pl)).join('');
    days += '<section class="day"><h3>' + esc(lab.main) + '<span>' + esc(lab.sub) + '</span></h3>' + rows + '</section>';
  }
  const anyRecipe = pl.slots.some((s) => s.rid);
  return '<div class="sec"><span class="cap">Voor hoeveel dagen</span><div class="seg">' + dayBtns + '</div></div>'
    + '<div class="sec"><span class="cap">Welke maaltijden</span><div class="seg">' + mealBtns + '</div></div>'
    + '<div class="sec grid2"><div class="field"><label for="persons">Personen</label><input id="persons" type="number" min="1" max="8" value="' + pl.persons + '" data-a="persons"></div>'
    + '<div class="field"><label for="budget">Budget dit menu (€)</label><input id="budget" type="number" min="0" step="1" value="' + (pl.budgetOverride != null ? pl.budgetOverride : auto) + '" data-a="budget"></div></div>'
    + '<div class="actions sec"><button class="btn primary" data-a="new">Nieuw menu</button><button class="linkbtn" data-a="tofile">Bewaar dagen en maaltijden in dit profiel</button></div>'
    + diagHTML() + (anyRecipe ? '<div class="sec"><span class="cap">Weekoverzicht</span>' + weekGridHTML() + '</div>' + days : '<div class="empty">Er zijn geen recepten die bij dit profiel passen.</div>' + days);
}

function listHTML() {
  const pl = ST.plan; const P = activeP(); const c = calc();
  const cmp = D.stores.map((s) => {
    const rids = c.rids; const bl = buildList(D, PRICES, s.id, rids, pl.persons, P.halal); const sm = sumLines(bl.lines, pl.have);
    return '<button data-a="store" data-v="' + s.id + '" aria-pressed="' + (pl.store === s.id) + '"><span>' + esc(s.naam) + '</span><b class="num">' + eur(sm.all) + '</b></button>';
  }).join('');
  let rec = '';
  D.depts.forEach((d) => {
    const ls = c.bl.lines.filter((l) => l.ing.dept === d[0] && !l.halalMeat);
    if (!ls.length) return;
    rec += '<h4>' + esc(d[1]) + '</h4>' + ls.map(lineHTML).join('');
  });
  const hm = c.bl.lines.filter((l) => l.halalMeat);
  if (hm.length) rec += '<h4>Vlees (halal, slager of Turkse supermarkt)</h4>' + hm.map(lineHTML).join('');
  if (c.bl.pantry.length) rec += '<h4>Voorraadkast, check even</h4><div class="small" style="font-family:var(--sans)">' + c.bl.pantry.map((p) => esc(p.naam.toLowerCase())).join(', ') + '</div>';
  const text = shareText(D, pl.store, c.bl.lines, c.bl.pantry, pl.have, c.sm.all, storeName(pl.store));
  const copyFallback = UI.copy ? '<div class="sec"><span class="cap">Selecteer en kopieer</span><textarea id="copytxt" readonly>' + esc(UI.copy) + '</textarea></div>' : '';
  if (!c.bl.lines.length) return '<div class="empty">Nog geen boodschappen. Maak eerst een menu.</div>';
  return '<div class="sec" style="margin-top:14px"><span class="cap">Vergelijk winkels voor dit menu</span><div class="cmp">' + cmp + '</div><p class="small">' + esc(priceStatus(pl.store)) + '</p></div>'
    + '<div class="receipt" aria-label="Boodschappenlijst">' + rec
    + '<div class="tot"><span>Totaal ' + esc(storeName(pl.store)) + '</span><b class="num">' + eur(c.sm.all) + '</b></div></div>'
    + '<div class="actions sec"><button class="btn primary" data-a="share">Deel lijst</button><button class="btn" data-a="copy">Kopieer lijst</button></div>'
    + '<p class="small">Delen opent het deelmenu van je telefoon, daar kies je Notities of Herinneringen. Vink af wat je al in huis hebt, dan gaat het van het totaal af.</p>' + copyFallback
    + '<textarea id="sharetxt" class="sr" tabindex="-1" aria-hidden="true">' + esc(text) + '</textarea>';
}
function lineHTML(l) {
  const pl = ST.plan; const have = !!pl.have[l.id];
  const price = l.bonus ? '<span class="was num">' + eur(l.packs * l.was) + '</span><span class="num">' + eur(l.cost) + '</span>' : '<span class="num">' + eur(l.cost) + '</span>';
  const tags = (l.bonus ? '<span class="tag">bonus' + (l.mech ? ' ' + esc(l.mech) : '') + '</span>' : '') + (l.halalMeat ? '<span class="tag">halal</span>' : '');
  return '<div class="rl' + (have ? ' have' : '') + '"><input type="checkbox" data-a="have" data-v="' + l.id + '"' + (have ? ' checked' : '') + ' aria-label="Heb ik al: ' + esc(l.ing.naam) + '">'
    + '<span class="nm">' + esc(l.ing.naam) + tags + '<span class="sub">' + (l.halalMeat ? amountText(l.ing.unit, l.need) : l.packs + '× ' + amountText(l.ing.unit, l.size) + ' · nodig ' + amountText(l.ing.unit, l.need)) + (l.label ? ' · ' + esc(l.label) : '') + '</span></span>'
    + '<span class="pr">' + price + '</span></div>';
}

function render() {

  if (t === 'menu') body = menuHTML();
  else if (t === 'lijst') body = listHTML();
  else if (t === 'inzicht') body = inzichtHTML();
  else if (t === 'recepten') body = UI.draft ? recipesHTML() : favsHTML() + recipesHTML();
  else body = profielHTML();
  const tabs = [['menu', 'Menu'], ['lijst', 'Lijst'], ['inzicht', 'Inzicht'], ['recepten', 'Recepten'], ['profiel', 'Profiel']]

  APP.innerHTML = headerHTML() + '<main>' + body + '</main><nav class="tabs" role="tablist" aria-label="Onderdelen"><div class="tabs-in">' + tabs + '</div></nav>' + (UI.toast ? '<div class="toast" role="status">' + esc(UI.toast) + '</div>' : '');

function toast(msg) { UI.toast = msg; render(); setTimeout(() => { UI.toast = ''; render(); }, 1800); }

/* ---------- acties ---------- */
function updP(fn) { fn(activeP()); if (ST.activeId !== 'temp') save(); render(); }
function toggle(arr, v) { const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); }

async function doCopy(text) {
  try { await navigator.clipboard.writeText(text); UI.copy = null; toast('Lijst gekopieerd'); } catch (e) { UI.copy = text; render(); }
}
async function doShare(text) {
  if (navigator.share) {
    try { await navigator.share({ title: 'Boodschappen', text }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  doCopy(text);
}
function listText() { const c = calc(); const pl = ST.plan; return shareText(D, pl.store, c.bl.lines, c.bl.pantry, pl.have, c.sm.all, storeName(pl.store)); }

function newDraft(r) {
  if (r) return { id: r.id, naam: r.naam, meals: r.meals.slice(), t: r.t, w: r.w || 0, needs: r.needs.slice(), items: r.ing.map((x) => ({ id: x[0], a: x[1] })), steps: r.steps.join('\n'), v: r.v == null ? '' : r.v, e: r.e == null ? '' : r.e, newIng: null, row: null };
  return { id: null, naam: '', meals: ['diner'], t: 20, w: 0, needs: ['fornuis'], items: [{ id: '', a: '' }], steps: '', v: '', e: '', newIng: null, row: null };
}
const SOORT = { plant: [], zuivel: ['animal'], vlees: ['meat', 'animal'], varken: ['meat', 'animal', 'pork'], vis: ['fish', 'animal'] };

function saveDraft() {
  const d = UI.draft;
  const items = d.items.filter((x) => x.id && x.id !== '__new' && parseFloat(x.a) > 0);
  if (!d.naam.trim()) { UI.err = 'Geef het recept een naam.'; return render(); }
  if (!d.meals.length) { UI.err = 'Kies minstens één maaltijd.'; return render(); }
  if (!items.length) { UI.err = 'Voeg minstens één ingrediënt met een hoeveelheid toe.'; return render(); }
  const rec = { id: d.id || 'own-' + uid(), naam: d.naam.trim(), meals: d.meals.slice(), t: parseInt(d.t, 10) || 0, w: parseInt(d.w, 10) || 0, needs: d.needs.slice(), cat: 'eigen', ing: items.map((x) => [x.id, parseFloat(x.a)]), v: d.v === '' ? null : parseFloat(d.v), e: d.e === '' ? null : parseFloat(d.e), kcal: null, steps: d.steps.split('\n').map((s) => s.trim()).filter(Boolean) };
  const i = ST.custom.recipes.findIndex((r) => r.id === rec.id);
  if (i >= 0) ST.custom.recipes[i] = rec; else ST.custom.recipes.push(rec);
  rebuild(); save(); UI.draft = null; UI.err = '';
  toast('Recept opgeslagen');
}

function act(a, ds, el) {
  if (tasteAct(a, ds)) return;
  const pl = ST.plan; const P = activeP(); const i = ds.i != null ? parseInt(ds.i, 10) : null;
  switch (a) {
    case 'tab': UI.tab = ds.v; UI.copy = null; render(); window.scrollTo(0, 0); break;
    case 'store': pl.store = ds.v; save(); render(); break;
    case 'days': pl.cfg.days = parseInt(ds.v, 10); reconcile(); render(); break;
    case 'mealtog': {
      const m = ds.v; const on = pl.cfg.meals.indexOf(m) >= 0;
      if (on && pl.cfg.meals.length === 1) { toast('Kies minstens één maaltijd'); break; }
      if (on) pl.cfg.meals.splice(pl.cfg.meals.indexOf(m), 1); else pl.cfg.meals.push(m);
      pl.cfg.meals.sort((x, y) => MEALS.indexOf(x) - MEALS.indexOf(y));
      reconcile(); render(); break;
    }
    case 'new': newPlan(); UI.open = {}; UI.tab = 'menu'; render(); window.scrollTo(0, 0); break;
    case 'tofile': updP((p) => { p.days = pl.cfg.days; p.meals = pl.cfg.meals.slice(); }); toast('Opgeslagen in profiel'); break;
    case 'swap': { const rid = pickForSlot(D, PRICES, P, pl, i, pl.store, Math.random); if (rid) { pl.slots[i].rid = rid; pl.slots[i].done = false; save(); render(); } else toast('Geen ander recept beschikbaar'); break; }
    case 'remove': pl.slots[i].rid = null; pl.slots[i].done = false; save(); render(); break;
    case 'add': { const rid = pickForSlot(D, PRICES, P, pl, i, pl.store, Math.random); if (rid) { pl.slots[i].rid = rid; save(); render(); } else toast('Geen recept beschikbaar'); break; }
    case 'open': UI.open[i] = !UI.open[i]; render(); break;
    case 'done': pl.slots[i].done = el.checked; save(); render(); break;
    case 'fav': { const rid = pl.slots[i].rid; toggle(ST.favs, rid); save(); render(); break; }
    case 'unfav': toggle(ST.favs, ds.v); save(); render(); break;
    case 'usefav': {
      const r = D.rec[ds.v]; const m = r.meals.find((x) => pl.cfg.meals.indexOf(x) >= 0);
      if (!m) { toast('Zet eerst ' + MEAL_NL[r.meals[0]].toLowerCase() + ' aan in je menu'); break; }
      let idx = pl.slots.findIndex((s) => s.meal === m && !s.rid);
      if (idx < 0) idx = pl.slots.findIndex((s) => s.meal === m);
      pl.slots[idx].rid = r.id; pl.slots[idx].done = false; save(); UI.tab = 'menu'; render(); toast('Toegevoegd aan je menu'); break;
    }
    case 'have': if (el.checked) pl.have[ds.v] = true; else delete pl.have[ds.v]; save(); render(); break;
    case 'copy': doCopy(listText()); break;
    case 'share': doShare(listText()); break;
    case 'pick': ST.activeId = ds.v; if (ds.v !== 'temp') save(); newPlan(); render(); break;
    case 'padd': {
      if (ST.profiles.length >= MAX_PROFILES) break;
      const np = Object.assign({}, JSON.parse(JSON.stringify(P)), { id: uid(), naam: 'Profiel ' + (ST.profiles.length + 1) });
      ST.profiles.push(np); ST.activeId = np.id; save(); newPlan(); render(); break;
    }
    case 'ptemp': {
      const def = ST.profiles.find((p) => p.id === ST.defaultId) || ST.profiles[0];
      TEMP = Object.assign({}, JSON.parse(JSON.stringify(def)), { id: 'temp', naam: 'Tijdelijk' }); ST.activeId = 'temp'; newPlan(); render(); break;
    }
    case 'pkeep': {
      if (ST.profiles.length >= MAX_PROFILES) break;
      const np = Object.assign({}, JSON.parse(JSON.stringify(TEMP)), { id: uid(), naam: 'Profiel ' + (ST.profiles.length + 1) });
      ST.profiles.push(np); TEMP = null; ST.activeId = np.id; ST.plan.pid = np.id; save(); render(); break;
    }
    case 'pdefault': ST.defaultId = P.id; save(); render(); break;
    case 'pdel': {
      if (ST.profiles.length < 2) break;
      ST.profiles = ST.profiles.filter((p) => p.id !== P.id);
      if (ST.defaultId === P.id) ST.defaultId = ST.profiles[0].id;
      ST.activeId = ST.defaultId; save(); newPlan(); render(); break;
    }
    case 'ptog': updP((p) => { if (ds.f === 'meals' && p.meals.length === 1 && p.meals[0] === ds.v) return; toggle(p[ds.f], ds.v); if (ds.f === 'meals') p.meals.sort((x, y) => MEALS.indexOf(x) - MEALS.indexOf(y)); }); break;
    case 'pbool': updP((p) => { p[ds.f] = !p[ds.f]; if (ds.f === 'vegan' && p.vegan) p.veg = true; }); break;
    case 'nutri': updP((p) => { p.nutri = ds.v; }); break;
    case 'export': UI.io = { text: JSON.stringify({ v: 1, profiles: ST.profiles, defaultId: ST.defaultId, favs: ST.favs, custom: ST.custom }), msg: 'Kopieer deze tekst en bewaar hem ergens veilig.' }; render(); break;
    case 'import': UI.io = { text: '', msg: 'Plak hier je back-up en kies importeren.' }; render(); break;
    case 'ioclose': UI.io = null; render(); break;
    case 'ioapply': {
      try {
        const j = JSON.parse(document.getElementById('iotxt').value);
        if (!j || !Array.isArray(j.profiles) || !j.profiles.length) throw new Error('profielen ontbreken');
        ST.profiles = j.profiles.slice(0, MAX_PROFILES); ST.defaultId = j.defaultId || ST.profiles[0].id; ST.favs = j.favs || [];
        ST.custom = j.custom || { ingredients: [], recipes: [] }; ST.activeId = ST.defaultId; TEMP = null;
        rebuild(); newPlan(); UI.io = null; toast('Back-up geïmporteerd');
      } catch (e) { UI.io.msg = 'Dit lijkt geen geldige back-up: ' + e.message; render(); }
      break;
    }
    case 'rnew': UI.draft = newDraft(null); UI.err = ''; render(); break;
    case 'redit': UI.draft = newDraft(D.rec[ds.v]); UI.err = ''; render(); break;
    case 'rdel': {
      ST.custom.recipes = ST.custom.recipes.filter((r) => r.id !== ds.v); ST.favs = ST.favs.filter((f) => f !== ds.v);
      rebuild(); ST.plan.slots.forEach((s) => { if (s.rid === ds.v) s.rid = null; }); save(); render(); break;
    }
    case 'rcancel': UI.draft = null; UI.err = ''; render(); break;
    case 'rsave': saveDraft(); break;
    case 'dmeal': toggle(UI.draft.meals, ds.v); render(); break;
    case 'dneed': toggle(UI.draft.needs, ds.v); render(); break;
    case 'rowadd': UI.draft.items.push({ id: '', a: '' }); render(); break;
    case 'rowdel': UI.draft.items.splice(i, 1); if (!UI.draft.items.length) UI.draft.items.push({ id: '', a: '' }); render(); break;
    case 'niall': toggle(UI.draft.newIng.al, ds.v); render(); break;
    case 'nicancel': { const d = UI.draft; if (d.row != null && d.items[d.row] && d.items[d.row].id === '__new') d.items[d.row].id = ''; d.newIng = null; render(); break; }
    case 'nisave': {
      const d = UI.draft; const n = d.newIng; const pack = parseFloat(n.pack); const price = parseFloat(n.price);
      if (!n.naam.trim() || !(pack > 0) || !(price >= 0)) { UI.err = 'Vul naam, inhoud en prijs van het ingrediënt in.'; render(); break; }
      const ing = { id: 'c-' + uid(), naam: n.naam.trim(), unit: n.unit, pack, price, cp: price, dept: 'overig', fl: SOORT[n.soort].slice(), al: n.al.slice(), q: n.naam.toLowerCase(), custom: true };
      ST.custom.ingredients.push(ing); rebuild(); save();
      if (d.row != null && d.items[d.row]) d.items[d.row].id = ing.id;
      d.newIng = null; UI.err = ''; render(); break;
    }
    default: break;
  }
}

APP.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-a], [data-a="open"]');
  if (!b || b.tagName === 'SELECT' || b.tagName === 'INPUT') return;
  act(b.dataset.a, b.dataset, b);
});

APP.addEventListener('change', (e) => {
  const el = e.target; const ds = el.dataset;
  if (el.tagName === 'INPUT' && el.type === 'checkbox' && ds.a) { act(ds.a, ds, el); return; }
  const pl = ST.plan;
  if (ds.a === 'profsel') { ST.activeId = el.value; if (el.value !== 'temp') save(); newPlan(); render(); return; }
  if (ds.a === 'persons') { pl.persons = Math.min(8, Math.max(1, parseInt(el.value, 10) || 1)); save(); render(); return; }
  if (ds.a === 'budget') { const v = parseFloat(el.value); pl.budgetOverride = isNaN(v) ? null : v; save(); render(); return; }
  if (ds.a === 'pfield') {
    updP((p) => {
      const f = ds.f; let v = el.value;
      if (f === 'personen') v = Math.min(8, Math.max(1, parseInt(v, 10) || 1));
      else if (f === 'budget') v = Math.max(0, parseFloat(v) || 0);
      else if (f === 'vezelDoel' || f === 'eiwitDoel') v = Math.max(0, parseInt(v, 10) || 0);
      else if (f === 'days') v = parseInt(v, 10);
      else if (f === 'maxTijd') v = v ? parseInt(v, 10) : null;
      else if (f === 'naam') v = v.trim() || 'Profiel';
      p[f] = v;
    });
    return;
  }
  if (ds.a === 'rowsel') {
    const d = UI.draft; const idx = parseInt(ds.i, 10);
    d.items[idx].id = el.value;
    if (el.value === '__new') { d.row = idx; d.newIng = { naam: '', unit: 'g', pack: '', price: '', soort: 'plant', al: [] }; }
    render(); return;
  }
  if (ds.d && UI.draft) draftInput(el);
});
APP.addEventListener('input', (e) => { if (e.target.dataset.d && UI.draft) draftInput(e.target); });
function draftInput(el) {
  const d = UI.draft; const k = el.dataset.d;
  if (k === 'row') d.items[parseInt(el.dataset.i, 10)].a = el.value;
  else if (k === 'ni') d.newIng[el.dataset.k] = el.value;
  else d[k] = el.value;
}

/* ---------- start ---------- */
async function loadPrices() {
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 2500);
    const r = await fetch('prijzen.json', { cache: 'no-store', signal: ctl.signal }); clearTimeout(t);
    if (r.ok) { const j = await r.json(); if (j && j.stores) return j; }
  } catch (e) { /* geen prijzenbestand */ }
  return (typeof EMBED !== 'undefined' && EMBED && EMBED.stores && EMBED.updated) ? EMBED : null;
}

(async function start() {
  document.documentElement.style.setProperty('--logo', 'url(' + LOGO_URL + ')'); document.documentElement.style.setProperty('--lr', LOGO_RATIO);
  PRICES = await loadPrices();
  ST = load();
  if (!ST || !Array.isArray(ST.profiles) || !ST.profiles.length) {
    const p = defaultProfile();
    ST = { profiles: [p], defaultId: p.id, activeId: p.id, favs: [], custom: { ingredients: [], recipes: [] }, plan: null };
  }
  if (!ST.custom) ST.custom = { ingredients: [], recipes: [] };
  if (!ST.favs) ST.favs = [];
  if (!ST.photos) ST.photos = {};
  if (!ST.taste) ST.taste = { done: false, liked: [], disliked: [], never: [], nopeIng: [] };
  ST.activeId = ST.defaultId;
  rebuild();
  applyTaste();
  const pl = ST.plan;
  const ok = pl && pl.cfg && Array.isArray(pl.slots) && pl.slots.length && pl.slots.every((s) => !s.rid || D.rec[s.rid]) && D.stores.some((s) => s.id === pl.store);
  if (ok) { if (ST.profiles.some((p) => p.id === pl.pid)) ST.activeId = pl.pid; if (!pl.have) pl.have = {}; } else newPlan();
  if (!ST.taste.done && !ST.profiles.some((p) => p.touched)) startTaste();
  render();
})();
