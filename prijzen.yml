name: Prijzen bijwerken

on:
  schedule:
    - cron: "0 5 * * 1"   # elke maandag 05:00 UTC, 07:00 Nederlandse zomertijd
  workflow_dispatch: {}    # handmatig starten via het tabblad Actions

permissions:
  contents: write

jobs:
  prijzen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prijzen ophalen
        run: python3 fetch_prijzen.py
      - name: Opslaan als er iets veranderd is
        run: |
          git config user.name "daily-table-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prijzen.json
          git diff --staged --quiet || git commit -m "Prijzen en acties van deze week"
          git push
